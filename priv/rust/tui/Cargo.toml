[package]
name = "osa-tui"
# Keep in sync with the repo-root VERSION file — build.rs warns on drift and
# `config::version_source_tests` fails the build if they diverge. This literal is
# only ever a last-resort fallback: build.rs prefers $OSA_VERSION (release CI),
# then the VERSION file.
version = "1.0.131"
edition = "2021"

[[bin]]
name = "osagent"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
similar = { version = "2", features = ["text"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
directories = "5"
anyhow = "1"
unicode-width = "0.2"
unicode-segmentation = "1"

# Voice input
cpal = "0.15"
hound = "3.5"
zip = "2"
portable-pty = { version = "0.9", default-features = false }
vt100 = "0.15"

[profile.release]
lto = "thin"
strip = true
opt-level = "z"

# Ctrl+Z suspend (SIGTSTP job control) — unix only
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `test-util` gives tests a pausable clock. The SSE idle-timeout test has to
# prove a 90s budget actually fires; with a virtual clock that costs
# milliseconds instead of a 90-second suite. Resolver 2 (edition 2021) keeps
# dev-dependency features out of the release binary.
tokio = { version = "1", features = ["full", "test-util"] }
# Env vars are process-global and cargo runs tests multi-threaded. Any test that
# sets HOME/TERM/OSA_HYPERLINKS must be #[serial] or it races every other test
# that reads them (config::cli resolves ~/.osa from HOME).
serial_test = "3"

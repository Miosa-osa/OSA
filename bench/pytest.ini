; Pytest configuration for `bench/`.
;
; WHY THIS FILE EXISTS
; --------------------
; There was no pytest config anywhere in the repo, so a bare `pytest` run from
; `bench/` (or the repo root) collected `terminalbench/tasks/*/tests/test_*.py`
; -- the *benchmark tasks' own* test files -- alongside our tests.
;
; Two consequences, one cosmetic and one not:
;
;   1. It compiled them, leaving `__pycache__` inside the task copies. Harbor
;      uploads the whole `tests/` directory into the grading container
;      (`verifier/verifier.py:133-238`), so host-compiled bytecode was being
;      shipped into the environment that decides the score. Measured
;      2026-08-15: 27 `__pycache__` directories and 38 `.pyc` files across the
;      task copies, every one of them stamped that same day and named
;      `cpython-312-pytest-9.1.1`, i.e. all of them ours. The canonical Hub
;      download contains zero. A stale `.pyc` whose source no longer matches is
;      silent contamination of a grading run.
;
;   2. Collection *imports* those files on the host. Task tests are arbitrary
;      third-party code written to run inside a disposable container, not on a
;      developer machine.
;
; `norecursedirs` stops collection from descending into the task copies and the
; run artefacts at all, which fixes both. `bench/terminalbench/controls.py`
; additionally refuses to launch a run while stray bytecode exists, so this
; file failing quietly cannot re-contaminate a scored run.
[pytest]
; PYTEST MUST NOT PUT THESE DIRECTORIES ON `sys.path` ITSELF.
; -----------------------------------------------------------------------------
; Under the default "prepend" import mode, collecting a test file that is not in
; a package makes pytest insert its directory at `sys.path[0]`. With four
; sibling benchmark packages that share basenames (`run_bench.py`,
; `runners.py`, `evaluate.py`, `workspace.py`, `report.py`), that turns
; collection ORDER into import resolution: measured 2026-08-15, collecting
; `swebenchpro` before `swebench` left `bench/swebench` ahead of
; `bench/swebenchpro` on the path, which is precisely what
; `test_swebench_never_shadows_us_on_the_path` exists to catch, and it failed.
; The alphabetical default order happened to be safe; nothing guaranteed it.
;
; `importlib` mode imports each test module from its own file location and
; leaves `sys.path` alone, so no ordering can shadow anything. Test files still
; add their OWN directory for their sibling imports, which is safe because it is
; scoped to the module doing it.
addopts = --import-mode=importlib
;
; SETTING `norecursedirs` REPLACES PYTEST'S DEFAULTS, IT DOES NOT EXTEND THEM.
; -----------------------------------------------------------------------------
; The default value is `*.egg .* _darcs build CVS dist node_modules venv
; {arch}`, and the leading `.*` is what normally keeps virtualenvs out. Naming
; only `terminalbench/.venv` above therefore *un*-excluded every other dotted
; directory in the tree. Measured 2026-08-15: a bare `python3 -m pytest` from
; `bench/` collected 1,245 `test_*.py` files out of `swebenchpro/.venv/lib`
; alone -- third-party site-packages test suites, imported on the host -- and
; had not finished collecting after ten minutes. `.*` is restored below, and
; every entry pytest ships is repeated explicitly so the next edit to this list
; cannot silently drop one again.
;
; The run-artefact and vendored trees are excluded for the same reason as the
; task copies: they are full of other people's `test_*.py`, and `bench/` owns
; none of it.
norecursedirs =
    ; pytest's own defaults, repeated because this key overrides them
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
    ; benchmark task copies -- see the note at the top of this file
    terminalbench/tasks
    ; run artefacts: agent workspaces, checked-out repos, grader trees
    terminalbench/runs
    swebench/runs
    swebenchpro/runs
    swebenchpro/harness
    swebenchpro/data
    recoverybench/runs
    recoverybench/upstream
    headtohead/runs
    modelsweep/runs
    modelsweep/homes
    ; built release tarballs shipped into containers
    terminalbench/dist
    terminalbench/dist-bullseye
    .git
    *.egg-info

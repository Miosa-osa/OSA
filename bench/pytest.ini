; Pytest configuration for `bench/`.
;
; WHY THIS FILE EXISTS
; --------------------
; There was no pytest config anywhere in the repo, so a bare `pytest` run from
; `bench/` (or the repo root) collected `terminalbench/tasks/*/tests/test_*.py`
; -- the *benchmark tasks' own* test files -- alongside our tests.
;
; Two consequences, one cosmetic and one not:
;
;   1. It compiled them, leaving `__pycache__` inside the task copies. Harbor
;      uploads the whole `tests/` directory into the grading container
;      (`verifier/verifier.py:133-238`), so host-compiled bytecode was being
;      shipped into the environment that decides the score. Measured
;      2026-08-15: 27 `__pycache__` directories and 38 `.pyc` files across the
;      task copies, every one of them stamped that same day and named
;      `cpython-312-pytest-9.1.1`, i.e. all of them ours. The canonical Hub
;      download contains zero. A stale `.pyc` whose source no longer matches is
;      silent contamination of a grading run.
;
;   2. Collection *imports* those files on the host. Task tests are arbitrary
;      third-party code written to run inside a disposable container, not on a
;      developer machine.
;
; `norecursedirs` stops collection from descending into the task copies and the
; run artefacts at all, which fixes both. `bench/terminalbench/controls.py`
; additionally refuses to launch a run while stray bytecode exists, so this
; file failing quietly cannot re-contaminate a scored run.
[pytest]
norecursedirs =
    terminalbench/tasks
    terminalbench/runs
    terminalbench/dist
    terminalbench/dist-bullseye
    terminalbench/.venv
    swebench/runs
    swebenchpro/runs
    .git
    *.egg-info

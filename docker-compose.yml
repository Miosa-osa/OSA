services:
  osa:
    build: .
    ports:
      - "9089:9089"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OSA_DEFAULT_PROVIDER=ollama
    env_file:
      - .env
    volumes:
      # Matches the container's runtime HOME (/home/osa) so the non-root `osa`
      # user's ~/.osa data (SQLite DB, sessions, skills) is actually persisted.
      - osa_data:/home/osa/.osa
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # Busybox wget (Alpine) rejects GNU flags (--no-verbose/--tries) and
      # --spider sends a HEAD the GET-only /health route rejects; use a GET.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9089/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:11434/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  osa_data:
  ollama_data:

name: Labeler

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 20, which the runners now force onto Node 24 and will
      # eventually stop shimming. v6 was the Node 24 cutover; v7 is current.
      - uses: actions/labeler@v7
        with:
          sync-labels: true

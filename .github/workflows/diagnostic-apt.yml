name: DIAGNOSTIC apt conflict (temporary)

# TEMPORARY. Round 2: `libgstreamer1.0-dev` Depends: `libunwind-dev`, and that
# dependency is what cannot be satisfied on the runner. Finds out why.
on:
  push:
    paths:
      - '.github/workflows/diagnostic-apt.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: libunwind state
        run: |
          echo "=== installed libunwind ==="; dpkg -l | grep -i libunwind || echo "  (none)"
          echo "=== policy ==="; apt-cache policy libunwind-dev libunwind8 || true
          echo "=== available versions ==="; apt-cache madison libunwind-dev libunwind8 || true
          echo "=== apt preferences / pins ==="
          cat /etc/apt/preferences 2>/dev/null || echo "  (no /etc/apt/preferences)"
          ls /etc/apt/preferences.d/ 2>/dev/null && cat /etc/apt/preferences.d/* 2>/dev/null || echo "  (no preferences.d entries)"
          echo "=== sources ==="; grep -rhE "^deb " /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -10

      - name: Why can't libunwind-dev install
        run: |
          set +e
          echo "=== simulate libunwind-dev alone ==="
          sudo apt-get install -s libunwind-dev 2>&1 | tail -20

      - name: Does installing libunwind-dev first fix the chain
        run: |
          set +e
          sudo apt-get install -y -qq libunwind-dev > /tmp/lu.log 2>&1
          echo "libunwind-dev exit=$?"
          tail -6 /tmp/lu.log
          echo
          echo "=== now the gstreamer dev chain ==="
          sudo apt-get install -y -qq --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev > /tmp/gs.log 2>&1
          echo "gstreamer dev exit=$?"
          tail -8 /tmp/gs.log
          echo
          echo "=== pkg-config sees gstreamer? ==="
          pkg-config --modversion gstreamer-1.0 2>&1 || echo "  gstreamer-1.0 NOT found"
          pkg-config --modversion gstreamer-app-1.0 2>&1 || echo "  gstreamer-app-1.0 NOT found"

      - name: Alternative - is the dev package even needed
        run: |
          set +e
          echo "=== what the crate declares ==="
          grep -A 30 "\[dependencies\]" native/linux/ScreenShare/Cargo.toml | head -30

name: DIAGNOSTIC apt conflict (temporary)

# TEMPORARY. Round 3: confirm the mechanism (libunwind-14-dev conflict) and that
# the proposed fix lets the REAL helper build succeed on the runner.
on:
  push:
    paths:
      - '.github/workflows/diagnostic-apt.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@v7

      - name: BEFORE - who owns libunwind
        run: |
          echo "=== installed ==="; dpkg -l | grep -i libunwind || echo "  (none)"
          echo "=== does libunwind-14-dev declare a conflict with libunwind-dev? ==="
          dpkg -s libunwind-14-dev 2>/dev/null | grep -E "^(Package|Version|Conflicts|Replaces|Provides|Breaks)" || true
          echo "=== what would apt do (simulate)? ==="
          apt-get install -s libunwind-dev 2>&1 | grep -E "^(Inst|Remv|Conf)" | head -10 || true

      - name: THE FIX - install libunwind-dev first, then the chain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libunwind-dev
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config build-essential python3 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire

      - name: AFTER - confirm the replacement happened and gstreamer is usable
        run: |
          echo "=== libunwind now ==="; dpkg -l | grep -i libunwind || echo "  (none)"
          echo "=== pkg-config ==="
          for p in gstreamer-1.0 gstreamer-app-1.0 gstreamer-video-1.0; do
            printf '  %-22s %s\n' "$p" "$(pkg-config --modversion $p 2>&1)"
          done

      - name: THE REAL TEST - build the helper
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          bash native/linux/ScreenShare/build.sh
          echo "=== artifact ==="
          ls -la native/linux/ScreenShare/target/release/osa-screen-capture-wayland
          file native/linux/ScreenShare/target/release/osa-screen-capture-wayland

name: CI

# The test gate. Until this existed, NOTHING ran the test suites in CI:
# `labeler` labels PRs, `pty-layout` runs only the PTY harness (and only when
# TUI/harness paths change), and `release` builds artifacts on a version tag
# without running a single test. v1.0.069 was published with a red Rust test
# and CI reported success, because no lane was looking.
#
# Two independent suites, deliberately in SEPARATE jobs rather than one:
#   * they have no dependency on each other, so they run concurrently;
#   * a red Elixir suite still tells you whether Rust is healthy;
#   * running them in one job risks the CPU contention that produces phantom
#     failures locally (timing assertions in the Elixir suite fail when a
#     release-profile cargo build is saturating the cores beside them).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in lockstep with release.yml — a suite that passes on a toolchain the
  # release never uses is not a gate.
  #
  # DO NOT bump these casually. release.yml documents why: OTP 27 has Mix
  # release bugs and erlexec is pinned to 2.0.6 (the last pre-OTP-27 release).
  #
  # Note the gap this lane exists to cover: development happens on Elixir
  # 1.19.x / OTP 28, and the shipped artifact is built on 1.17.3 / OTP 26.2.5.
  # A locally green suite therefore says nothing about the toolchain users
  # actually receive. That is not a flaw in this pin — it is the reason the
  # pin has to stay matched to release.yml rather than to the dev machine.
  ELIXIR_VERSION: "1.17.3"
  OTP_VERSION: "26.2.5"

jobs:
  elixir:
    name: Elixir suite
    # ubuntu-24.04, not -22.04: the 22.04 images begin deprecation on
    # 2026-09-17 with brownout windows that TERMINATE the job, and are fully
    # unsupported on 2027-04-17 (actions/runner-images#14254). Nothing ships
    # from this lane, so moving it early costs nothing and buys a gate that
    # will not start failing for reasons unrelated to the code.
    #
    # The pinned toolchain survives the move: OTP 26.2.5 has a prebuilt for
    # ubuntu-24.04 on builds.hex.pm and setup-beam lists 24.3-29 as supported
    # there, so this is NOT a silent OTP 27 bump.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `version-type: strict` because the default is PREFIX matching, and it
      # drifts silently. `otp-version: 26.2.5` resolved to the newest build
      # beginning with that string — 26.2.5.21 — so this lane tested a
      # toolchain nobody pinned, and `ToolchainPinTest` (which compares the
      # RUNNING versions against `.tool-versions`, where asdf installs 26.2.5
      # exactly) failed for that reason alone. Its own comment names the stake:
      # this is the drift that hid a ReDoS in the safety gate for eight
      # releases.
      #
      # The env pins above are unchanged and still hold ci.yml and release.yml
      # to the same declared versions; only the RESOLUTION of those strings is
      # tightened, and only here. release.yml resolves the same pins across
      # ubuntu, macOS and Windows runners whose available build lists differ,
      # and turning strict matching on for a lane that cannot be exercised
      # without cutting a tag would trade a diagnosable red test for a release
      # that fails at setup.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          # The image version is part of the key on purpose. `runner.os` is
          # just "Linux" for both 22.04 and 24.04, so without this a `_build`
          # produced on the old image — including natively compiled NIFs like
          # erlexec and exqlite, linked against that image's glibc and openssl
          # — would be restored onto the new one. That fails as a link error
          # deep in a dep, which reads like a code defect rather than a stale
          # cache. Bump `ubuntu-24.04` here whenever `runs-on` changes.
          key: ${{ runner.os }}-ubuntu-24.04-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      # ADVISORY, not blocking — and deliberately so, for now.
      #
      # The tree does not currently pass either of these: there are existing
      # compiler warnings, and `mix format --check-formatted` exits 1. Landing
      # them as blocking would make this workflow red on its first run, and a
      # gate that is always red is a gate everyone learns to ignore — which is
      # worse than no gate, because it looks like coverage.
      #
      # They run and are visible in the log. Promote each to blocking (drop
      # `continue-on-error`, and add `--warnings-as-errors` to the compile
      # above) in the same change that cleans up the backlog it is guarding.
      - name: Compiler warnings (advisory)
        continue-on-error: true
        run: mix compile --force --warnings-as-errors

      - name: Formatting (advisory)
        continue-on-error: true
        run: mix format --check-formatted

      # A unique port, for the same reason every local run needs one: the
      # default 9089 is a developer's live daemon, and a suite that binds it
      # fails in a way that looks like a code defect.
      #
      # `tee` under `pipefail` so the log survives the run WITHOUT weakening the
      # gate: mix's exit status still propagates, the step still fails.
      #
      # The log is written to `$RUNNER_TEMP`, OUTSIDE the checkout, because the
      # suite reads its own working tree. `Verification.WorkspaceFingerprint`
      # hashes `git status -uall` plus the bytes of every untracked file, and
      # `LoopNoopGateTest` asserts that a verification loop refuses to re-run a
      # failing command when nothing on disk changed between iterations. A
      # growing untracked `mix-test.log` in the repo root changed the
      # fingerprint on every capture, so the gate never fired, the loop spent
      # all five iterations, and the test timed out waiting for a terminal
      # state — a CI-only failure caused by CI writing into the subject.
      - name: Run test suite
        run: |
          set -o pipefail
          mix test 2>&1 | tee "$RUNNER_TEMP/mix-test.log"
        env:
          OSA_HTTP_PORT: "19087"

      # Why this exists: eight consecutive red runs went undiagnosed, and by
      # the time anyone looked the raw step logs were no longer retrievable in
      # full through the API — the failing test names survived only as run
      # annotations. Two things are needed to act on a red suite and neither
      # was reachable: the SEED (ExUnit randomises test order per run, and the
      # failures here rotate between runs, which is the signature of an
      # order-dependent test rather than a flaky one) and the full failure
      # text. Both are pinned here as a summary plus a downloadable artifact.
      - name: Report the failures
        if: failure()
        run: |
          {
            echo '## Elixir suite failed'
            echo
            echo 'Toolchain: Elixir ${{ env.ELIXIR_VERSION }} / OTP ${{ env.OTP_VERSION }}'
            echo '(local development runs 1.19.x / OTP 28 — a green local run does'
            echo 'not reproduce this lane).'
            echo
            echo '```'
            grep -E '^Running ExUnit with seed:|^Randomized with seed|tests?, [0-9]+ failures?' "$RUNNER_TEMP/mix-test.log" || true
            echo '```'
            echo
            echo '### Failing tests'
            echo
            echo '```'
            grep -E '^\s+[0-9]+\) (test|property) ' "$RUNNER_TEMP/mix-test.log" || echo '(could not parse — see the artifact)'
            echo '```'
            echo
            echo 'Reproduce the exact order with `mix test --seed <seed above>`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: elixir-test-log
          path: ${{ runner.temp }}/mix-test.log
          if-no-files-found: warn

  rust:
    name: Rust TUI suite
    # See the Elixir job for why 24.04. The apt list below was checked against
    # noble: all eight packages resolve there under the SAME names (the t64
    # transition renamed the libasound2 RUNTIME package, not `libasound2-dev`).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Identical to the list in release.yml and pty-layout.yml. The TUI links
      # xcb (clipboard), alsa (bell), oniguruma (syntect) and openssl; without
      # them the build dies in `alsa-sys` before a single test runs.
      - name: Install Rust TUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config build-essential libssl-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libonig-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            priv/rust/tui/target
          # Image version in the key — see the Elixir job. A `target/` built
          # against 22.04's libssl/libasound restored onto 24.04 fails at link
          # time, not compile time, which is the confusing kind of failure.
          key: ${{ runner.os }}-ubuntu-24.04-cargo-${{ hashFiles('priv/rust/tui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-cargo-

      # Advisory for the same reason as the Elixir side: `cargo fmt --check`
      # currently exits 1 on this tree. Visible in the log, promoted to
      # blocking by whoever does the formatting pass.
      - name: Formatting (advisory)
        continue-on-error: true
        working-directory: priv/rust/tui
        run: cargo fmt --check

      # `--release`, matching how it is run locally and how the binary ships.
      # The debug profile has different timing and different overflow
      # behaviour, so a debug-only gate would not be testing what users get.
      #
      # This is also the lane that catches version drift: the suite contains a
      # guard asserting priv/rust/tui/Cargo.toml agrees with the repo VERSION
      # file. That guard is why the release checklist is "bump both files,
      # THEN run the suite" — run in the other order it fires a release late,
      # which is exactly how it was missed once.
      - name: Run test suite
        working-directory: priv/rust/tui
        run: cargo test --release

  # A single required-status target, so branch protection has one check to
  # point at instead of a list that must be edited whenever a job is added.
  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [elixir, rust]
    if: always()
    steps:
      - name: Verify both suites passed
        run: |
          echo "elixir: ${{ needs.elixir.result }}"
          echo "rust:   ${{ needs.rust.result }}"
          if [ "${{ needs.elixir.result }}" != "success" ] || \
             [ "${{ needs.rust.result }}" != "success" ]; then
            echo "::error::a test suite did not pass"
            exit 1
          fi

name: Release

# Ships prebuilt, zero-toolchain artifacts on a version tag (e.g. v0.4.0).
#
# Strategy: a self-contained Elixir OTP release (bundles ERTS — runs with no
# Elixir/Erlang installed on the user's machine) plus the prebuilt Rust TUI
# binary. Both are uploaded as GitHub Release assets so `scripts/install.sh`
# can `curl` them down. No language toolchains required by the end user.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.17.3"
  # OTP 27 has Mix release bugs (TypedStruct.MixProject / Decimal.Error
  # "already compiled" during the dep walk) and erlexec is pinned to 2.0.6
  # (last pre-OTP-27 release) in mix.exs. Stay on OTP 26 until those land.
  OTP_VERSION: "26.2.5"

jobs:
  # ── Linux x64: OTP release (ERTS-bundled) + Rust TUI ─────────────────
  build-linux-x64:
    # DELIBERATELY still ubuntu-22.04, unlike every other job in the repo.
    #
    # This is the only lane whose runner choice is visible to users. A binary
    # links against the glibc of the machine that built it and will not start
    # on anything older: 22.04 is glibc 2.35, 24.04 is 2.39. Moving this job to
    # 24.04 would silently drop support for Ubuntu 22.04 (still LTS until 2027),
    # Debian 12 (2.36) and RHEL 9 (2.34) — a product decision, not a CI fix, so
    # it is not made here as a side effect of a maintenance pass.
    #
    # It cannot stay forever. ubuntu-22.04 begins deprecation on 2026-09-17,
    # with brownout windows that terminate the job, and is fully unsupported on
    # 2027-04-17 (actions/runner-images#14254). Before then, pick one:
    #   * accept the higher floor and move to ubuntu-24.04; or
    #   * keep the floor and build inside a `container: ubuntu:22.04` on a
    #     supported runner, which decouples the glibc floor from the image
    #     GitHub happens to offer — the durable answer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps + build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: linux-x64-${{ hashFiles('mix.lock') }}
          restore-keys: linux-x64-

      # System libraries the Rust TUI links against (audio, clipboard/xcb,
      # oniguruma for syntect, openssl). Needed to compile the TUI here.
      - name: Install Rust TUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config build-essential libssl-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libonig-dev

      - name: Install Elixir deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      # ── Stamp the version from the git tag (single source of truth) ─────
      # The tag (e.g. v1.0.0) is authoritative. Strip the leading "v" to a
      # plain semver, expose it as OSA_VERSION for the build steps below, and
      # write it into the VERSION file that mix.exs reads at compile time so the
      # OTP release reports the tag version. Any cached, stale .app is dropped
      # so `mix release` regenerates it with the stamped version — otherwise a
      # restored build cache could ship an old vsn to Application.spec/2.
      # Runs after the cache restore so the purge sticks.
      - name: Stamp version from tag
        shell: bash
        run: |
          # The tag itself (padded display form, e.g. v1.0.002) is authoritative
          # for the tag name and the GitHub Release title — those stay padded.
          # For the BUILD we NORMALIZE the tag to valid semver: strip leading
          # zeros from the patch (v1.0.002 -> 1.0.2). semver forbids leading
          # zeros, so mix/cargo would reject "1.0.002". The in-app display
          # re-pads this back to 1.0.00X at render time, so the operator still
          # reads the padded form everywhere.
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          OSA_VERSION="$(printf '%s' "${RAW_VERSION}" | awk '
            {
              v = $0; core = v; suffix = ""
              if (match(v, /[-+]/)) { core = substr(v, 1, RSTART - 1); suffix = substr(v, RSTART) }
              n = split(core, p, ".")
              if (n == 3 && p[3] ~ /^[0-9]+$/) printf "%s.%s.%d%s\n", p[1], p[2], p[3] + 0, suffix
              else print v
            }')"
          echo "OSA_VERSION=${OSA_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "${OSA_VERSION}" > VERSION
          find _build -name 'optimal_system_agent.app' -delete 2>/dev/null || true
          echo "Normalized build version ${OSA_VERSION} from tag ${GITHUB_REF_NAME}"

      # Self-contained OTP release. include_erts defaults to true, so the
      # tarball carries its own ERTS — the user needs no Erlang/Elixir.
      - name: Build OTP release (osagent)
        run: MIX_ENV=prod mix release osagent --overwrite
        env:
          OSA_VERSION: ${{ env.OSA_VERSION }}

      - name: Package OTP release tarball
        run: |
          mkdir -p dist
          tar -czf "dist/osa-linux-x64.tar.gz" -C _build/prod/rel/osagent .

      - name: Build Rust TUI
        env:
          OSA_VERSION: ${{ env.OSA_VERSION }}
        run: |
          cd priv/rust/tui
          cargo build --release
          cd -
          cp priv/rust/tui/target/release/osagent "dist/osagent-tui-linux-x64"
          chmod +x "dist/osagent-tui-linux-x64"

      - uses: actions/upload-artifact@v7
        with:
          name: osa-linux-x64
          path: dist/*
          if-no-files-found: error

  # ── macOS arm64 (Apple Silicon): OTP release + Rust TUI ──────────────
  # Its artifacts are REQUIRED to publish (see the gate in `publish`): macOS is
  # a shipping platform, and install.sh fetches osa-macos-arm64.tar.gz by name.
  build-macos-arm64:
    # macos-15, not macos-14: the macOS 14 images entered deprecation on
    # 2026-07-06, have brownout windows through October that terminate the job,
    # and are fully unsupported on 2026-11-02 (actions/runner-images#13518).
    # This lane has produced no binary for sixteen releases already; leaving it
    # pinned to a retiring image would make that permanent.
    #
    # erlef/setup-beam lists macOS-15 (x86_64 + arm64) as supported for OTP
    # 25-29, so the OTP 26.2.5 pin above survives the move.
    runs-on: macos-15  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps + build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          # `macos-15` is in the key because the runner image moved (14 -> 15).
          # `_build` holds natively compiled NIFs (erlexec, exqlite) linked
          # against the SDK of the image that built them; restoring a macos-14
          # `_build` here would either fail to link or, worse, ship a mismatched
          # object inside the release tarball. A cold cache costs a few minutes
          # once; the alternative is a corrupt artifact.
          key: macos-15-arm64-${{ hashFiles('mix.lock') }}
          restore-keys: macos-15-arm64-

      - name: Install Elixir deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      # Run from the repo root — both scripts derive every path from their own
      # location ($0), never from the caller's cwd. ScreenShare/build.sh did NOT
      # until v1.0.178: it passed cwd-relative swiftc inputs, died here on every
      # tagged release, and took the whole macOS lane down with it (#238).
      #
      # The `-nt` check is the other half of that lesson. priv/helpers/ is
      # TRACKED, so a helper that failed to deploy leaves the stale checked-in
      # binary behind and a mere existence test passes; `mix release` below then
      # bundles the stale copy and ships it silently. Comparing against a stamp
      # taken before the builds asserts the binaries were actually rewritten now.
      - name: Build bundled macOS desktop helpers
        run: |
          stamp="$(mktemp)"
          native/macos/ScreenShare/build.sh
          native/macos/AccessibilityHelper/build.sh
          for h in priv/helpers/osa-screen-capture-darwin priv/helpers/osa-accessibility-darwin; do
            [ -s "$h" ] && [ "$h" -nt "$stamp" ] || {
              echo "::error::macOS helper was not (re)built this run: $h"
              exit 1
            }
          done
          ls -l priv/helpers/

      # Stamp the tag version — see the linux job for the rationale.
      - name: Stamp version from tag
        shell: bash
        run: |
          # The tag itself (padded display form, e.g. v1.0.002) is authoritative
          # for the tag name and the GitHub Release title — those stay padded.
          # For the BUILD we NORMALIZE the tag to valid semver: strip leading
          # zeros from the patch (v1.0.002 -> 1.0.2). semver forbids leading
          # zeros, so mix/cargo would reject "1.0.002". The in-app display
          # re-pads this back to 1.0.00X at render time, so the operator still
          # reads the padded form everywhere.
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          OSA_VERSION="$(printf '%s' "${RAW_VERSION}" | awk '
            {
              v = $0; core = v; suffix = ""
              if (match(v, /[-+]/)) { core = substr(v, 1, RSTART - 1); suffix = substr(v, RSTART) }
              n = split(core, p, ".")
              if (n == 3 && p[3] ~ /^[0-9]+$/) printf "%s.%s.%d%s\n", p[1], p[2], p[3] + 0, suffix
              else print v
            }')"
          echo "OSA_VERSION=${OSA_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "${OSA_VERSION}" > VERSION
          find _build -name 'optimal_system_agent.app' -delete 2>/dev/null || true
          echo "Normalized build version ${OSA_VERSION} from tag ${GITHUB_REF_NAME}"

      - name: Build OTP release (osagent)
        run: MIX_ENV=prod mix release osagent --overwrite
        env:
          OSA_VERSION: ${{ env.OSA_VERSION }}

      - name: Package OTP release tarball
        run: |
          mkdir -p dist
          tar -czf "dist/osa-macos-arm64.tar.gz" -C _build/prod/rel/osagent .

      # Rust ships preinstalled on the macos-14 runner. openssl/oniguruma
      # come from the toolchain / vendored crates, so no brew step is needed.
      - name: Build Rust TUI
        env:
          OSA_VERSION: ${{ env.OSA_VERSION }}
        run: |
          cd priv/rust/tui
          cargo build --release
          cd -
          cp priv/rust/tui/target/release/osagent "dist/osagent-tui-macos-arm64"
          chmod +x "dist/osagent-tui-macos-arm64"

      - uses: actions/upload-artifact@v7
        with:
          name: osa-macos-arm64
          path: dist/*
          if-no-files-found: error

  # ── Windows x64: OTP release (ERTS-bundled) + Rust TUI ───────────────
  # Its artifacts are REQUIRED to publish (see the gate in `publish`): install.ps1
  # fetches osa-windows-x64.zip by name.
  build-windows-x64:
    # `windows-latest` is a floating label (currently windows-2025); setup-beam
    # supports OTP 21-29 on both windows-2022 and windows-2025, so there is no
    # retirement cliff here to pin away from.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP + Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps + build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: windows-x64-${{ hashFiles('mix.lock') }}
          restore-keys: windows-x64-

      - name: Install Elixir deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      # Stamp the tag version — see the linux job for the rationale. `shell: bash`
      # uses the Git-for-Windows bash that ships on the runner.
      - name: Stamp version from tag
        shell: bash
        run: |
          # The tag itself (padded display form, e.g. v1.0.002) is authoritative
          # for the tag name and the GitHub Release title — those stay padded.
          # For the BUILD we NORMALIZE the tag to valid semver: strip leading
          # zeros from the patch (v1.0.002 -> 1.0.2). semver forbids leading
          # zeros, so mix/cargo would reject "1.0.002". The in-app display
          # re-pads this back to 1.0.00X at render time, so the operator still
          # reads the padded form everywhere.
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          OSA_VERSION="$(printf '%s' "${RAW_VERSION}" | awk '
            {
              v = $0; core = v; suffix = ""
              if (match(v, /[-+]/)) { core = substr(v, 1, RSTART - 1); suffix = substr(v, RSTART) }
              n = split(core, p, ".")
              if (n == 3 && p[3] ~ /^[0-9]+$/) printf "%s.%s.%d%s\n", p[1], p[2], p[3] + 0, suffix
              else print v
            }')"
          echo "OSA_VERSION=${OSA_VERSION}" >> "$GITHUB_ENV"
          printf '%s\n' "${OSA_VERSION}" > VERSION
          find _build -name 'optimal_system_agent.app' -delete 2>/dev/null || true
          echo "Normalized build version ${OSA_VERSION} from tag ${GITHUB_REF_NAME}"

      # Self-contained OTP release. include_erts defaults to true, so the zip
      # carries its own ERTS — the user needs no Erlang/Elixir. Requires the
      # mix.exs :windows executable + erlexec fixes to assemble on Windows.
      - name: Build OTP release (osagent)
        run: mix release osagent --overwrite
        env:
          MIX_ENV: prod
          OSA_VERSION: ${{ env.OSA_VERSION }}

      # Package as a .zip (not tar.gz) so install.ps1's Expand-Archive works.
      - name: Package OTP release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path _build\prod\rel\osagent\* -DestinationPath dist\osa-windows-x64.zip -Force

      # Rust ships preinstalled on windows-latest. openssl/oniguruma come from
      # vendored crates; CI-compile is the acceptance bar (no runtime claim).
      - name: Build Rust TUI
        shell: pwsh
        env:
          OSA_VERSION: ${{ env.OSA_VERSION }}
        run: |
          Push-Location priv\rust\tui
          cargo build --release
          Pop-Location
          Copy-Item priv\rust\tui\target\release\osagent.exe dist\osagent-tui-windows-x64.exe -Force

      - uses: actions/upload-artifact@v7
        with:
          name: osa-windows-x64
          path: dist/*
          if-no-files-found: error

  # ── Publish GitHub Release ───────────────────────────────────────────
  # Publishes ONLY a complete release: every platform's assets, or nothing.
  # See the "Verify every expected asset" gate below for why.
  publish:
    # Wait for ALL platform builds so every artifact is present before attaching
    # (previously only needed linux-x64, which raced: publish ran the instant
    # linux finished and missed the windows artifact that landed seconds later).
    #
    # if: always() runs this job even when a platform build failed — NOT to
    # publish anyway, but so the gate below can name the exact assets that went
    # missing and fail with that message. Skipping the job instead would leave
    # only a red build-* job and no statement about the release itself.
    needs: [build-linux-x64, build-macos-arm64, build-windows-x64]
    if: always()
    # Safe to move to 24.04 ahead of the build jobs: this one ships no compiled
    # artifact, it only downloads, checksums and publishes. No glibc floor.
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # required to create the GitHub Release
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect assets + compute checksums
        run: |
          mkdir -p release-assets
          # Flatten every artifact dir into release-assets/.
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          # A .sha256 sidecar per shippable asset so install.sh / install.ps1 can
          # verify integrity. Covers the *nix tarballs, the Windows zip, AND the
          # standalone Rust TUI binaries (osagent-tui-*) — the TUI is downloaded
          # separately from the tarball, so it needs its own checksum to close the
          # supply-chain gap (M2). Skip any .sha256 we may already have written.
          for f in *.tar.gz *.zip osagent-tui-*; do
            [ -e "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      # ── Gate: a partial release must never publish green ─────────────────
      #
      # v1.0.177 shipped with ZERO macOS assets and a green Release page. The
      # macOS lane died early (a build script that only worked from its own
      # directory), so its tarball and TUI never existed — and NOTHING in the
      # publish path noticed: `if: always()` kept this job going and
      # softprops/action-gh-release defaults fail_on_unmatched_files:false, so
      # it attached whatever files did show up and called it done.
      # install.sh downloads osa-macos-arm64.tar.gz by name, so every new macOS
      # install and every macOS auto-update broke, silently, for real users.
      #
      # The asymmetry is the whole point: a tag is cheap and re-runnable, a
      # published-but-broken Release is neither — it is immediately visible to
      # installers and to `osa update`. So the expected asset set is verified
      # HERE, before the Release exists, and a gap fails the job with the names
      # of the missing files. A broken platform is still perfectly visible (its
      # own job is red, and this step says which assets it owed); it just can no
      # longer produce a green, half-empty release.
      #
      # Fix the platform build and re-run the workflow — the same tag then
      # publishes complete. Shipping deliberately without a platform stays
      # possible, but only as a conscious manual act (`gh release create`),
      # never as the silent default.
      - name: Verify every expected asset is present
        run: |
          missing=""
          for f in \
            osa-linux-x64.tar.gz \
            osagent-tui-linux-x64 \
            osa-macos-arm64.tar.gz \
            osagent-tui-macos-arm64 \
            osa-windows-x64.zip \
            osagent-tui-windows-x64.exe
          do
            # -s, not -e: a 0-byte tarball is a missing asset wearing a filename.
            # The .sha256 sidecar is checked too — install.sh verifies against it,
            # so an asset without one is not installable either.
            for a in "$f" "$f.sha256"; do
              [ -s "release-assets/$a" ] || missing="${missing} ${a}"
            done
          done
          if [ -n "${missing}" ]; then
            echo "::error::Refusing to publish ${GITHUB_REF_NAME} — missing release assets:${missing}"
            echo "No GitHub Release was created. Check the failed build-* job above,"
            echo "fix it, and re-run this workflow for the same tag."
            exit 1
          fi
          echo "All expected assets present:"
          ls -1 release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "OSA ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # Backstop for the gate above: if this list and the gate's list ever
          # drift, an unmatched pattern fails the job instead of quietly
          # attaching one file fewer.
          fail_on_unmatched_files: true
          files: |
            release-assets/osa-linux-x64.tar.gz
            release-assets/osa-linux-x64.tar.gz.sha256
            release-assets/osagent-tui-linux-x64
            release-assets/osagent-tui-linux-x64.sha256
            release-assets/osa-macos-arm64.tar.gz
            release-assets/osa-macos-arm64.tar.gz.sha256
            release-assets/osagent-tui-macos-arm64
            release-assets/osagent-tui-macos-arm64.sha256
            release-assets/osa-windows-x64.zip
            release-assets/osa-windows-x64.zip.sha256
            release-assets/osagent-tui-windows-x64.exe
            release-assets/osagent-tui-windows-x64.exe.sha256

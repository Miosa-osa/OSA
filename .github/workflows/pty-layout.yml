name: PTY layout

# The layout suite the in-process Rust tests structurally cannot be.
#
# `cargo test` renders through `VT100Backend`, a perfect in-process emulator
# that answers ratatui's DSR cursor queries from its own model. The inline
# viewport's re-anchor therefore always lands on the right row, and the whole
# "a resize strands one copy of the live region per step" class cannot
# materialise — a single window drag once left nine stacked composers on screen
# with ~1000 tests green.
#
# This lane drives the REAL `osagent` binary on a REAL kernel PTY, resizes it
# with TIOCSWINSZ (delivering SIGWINCH exactly like a drag), renders the output
# through `pyte`, and asserts exactly one composer / status bar afterwards.
#
# No display server is needed — a PTY is not a GUI — so this runs on a plain
# ubuntu runner. See test/pty/README.md for the documented pyte-vs-VTE reflow
# limitation that bounds what a green run here proves.

on:
  push:
    branches: [main]
    paths:
      - "priv/rust/tui/**"
      - "test/pty/**"
      - ".github/workflows/pty-layout.yml"
  pull_request:
    paths:
      - "priv/rust/tui/**"
      - "test/pty/**"
      - ".github/workflows/pty-layout.yml"
  workflow_dispatch:

concurrency:
  group: pty-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pty-layout:
    # ubuntu-24.04: the 22.04 images begin deprecation on 2026-09-17 with
    # brownout windows that terminate the job outright, and are fully
    # unsupported on 2027-04-17 (actions/runner-images#14254). The apt list
    # below resolves unchanged on noble — verified package by package.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The TUI links system libraries (xcb for the clipboard, alsa for the
      # notification bell, oniguruma for syntect, openssl). A developer box
      # generally has them; a bare runner does not, and without them the build
      # fails in `alsa-sys` before the harness ever starts. Kept identical to
      # the release workflow's list so the two lanes cannot drift.
      - name: Install Rust TUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config build-essential libssl-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libonig-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            priv/rust/tui/target
          # The image version is in the key deliberately: `runner.os` is "Linux"
          # for both 22.04 and 24.04, so without it a `target/` linked against
          # the old image's libssl/libasound would be restored onto the new one
          # and fail at link time. Bump it whenever `runs-on` changes.
          key: pty-cargo-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('priv/rust/tui/Cargo.lock') }}
          restore-keys: pty-cargo-${{ runner.os }}-ubuntu-24.04-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pyte
        run: python3 -m pip install --upgrade pyte

      # `run.sh` builds the release binary itself, so the harness runs against
      # exactly what a user would run — not a debug build with different timing.
      #
      # `tee` under `pipefail`: the harness's exit status still propagates, so
      # the gate is unchanged. The capture exists because this suite's failure
      # output IS a screen dump — the evidence is the rendered terminal, and
      # when this lane last went red (test_height_resize, v1.0.83) that dump
      # was only ever in the step log, which is no longer fully retrievable.
      - name: Run the PTY layout harness
        run: |
          set -o pipefail
          ./test/pty/run.sh 2>&1 | tee pty-layout.log

      - name: Upload the screen dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pty-layout-log
          path: pty-layout.log
          if-no-files-found: warn
